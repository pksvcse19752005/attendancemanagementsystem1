<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Attendance Management System</title>

  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: "Segoe UI", Arial, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      color: white;
    }

    .container {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .glass {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(18px);
      border-radius: 20px;
      border: 1px solid rgba(255, 255, 255, 0.22);
      padding: 30px;
      box-shadow: 0px 10px 40px rgba(0,0,0,0.25);
      transition: 0.3s;
    }

    .glass:hover {
      transform: translateY(-4px);
    }

    .login-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      max-width: 1000px;
      width: 100%;
    }

    h2 {
      font-size: 1.9rem;
      margin-bottom: 18px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: none;
      border-radius: 10px;
      background: rgba(255,255,255,0.18);
      color: white;
      font-size: 1rem;
      outline: none;
    }

    input::placeholder {
      color: rgba(255,255,255,0.8);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(45deg, #ff6b6b, #feca57);
      border: none;
      border-radius: 10px;
      color: white;
      font-weight: 700;
      cursor: pointer;
      margin: 10px 0;
      font-size: 1rem;
      transition: 0.3s;
    }

    .btn:hover {
      transform: scale(1.03);
      box-shadow: 0px 5px 20px rgba(0,0,0,0.25);
    }

    .btn-sec {
      background: linear-gradient(45deg, #4ecdc4, #44a08d);
    }

    .btn-danger {
      background: linear-gradient(45deg, #ff4757, #ff3838);
    }

    .dash {
      display: none;
      padding: 20px;
      max-width: 1400px;
      margin: 0 auto;
      animation: fadeIn 0.5s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0px); }
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .logout {
      background: linear-gradient(45deg, #ff4757, #ff3838);
      padding: 10px 22px;
      border-radius: 25px;
      color: white;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      transition: 0.3s;
    }

    .logout:hover {
      transform: scale(1.05);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      margin-bottom: 25px;
    }

    .stat {
      padding: 20px;
      text-align: center;
    }

    .stat-num {
      font-size: 2.2rem;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 20px;
      margin-top: 15px;
    }

    .chart-cont {
      height: 320px;
      padding: 10px;
    }

    .toast {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 15px 20px;
      border-radius: 12px;
      color: white;
      transform: translateX(450px);
      transition: all 0.3s ease;
      z-index: 1000;
      font-weight: 600;
      box-shadow: 0px 8px 30px rgba(0,0,0,0.25);
    }

    .toast.show {
      transform: translateX(0);
    }

    .success { background: #4caf50; }
    .error { background: #f44336; }
    .info { background: #2196f3; }

    .student-status {
      font-size: 3rem;
      margin: 20px 0;
    }

    .badge {
      padding: 18px 30px;
      border-radius: 50px;
      font-weight: bold;
      display: inline-block;
      min-width: 200px;
      text-align: center;
      box-shadow: 0px 6px 20px rgba(0,0,0,0.2);
    }

    .present {
      background: linear-gradient(45deg, #4caf50, #45a049);
    }

    .absent {
      background: linear-gradient(45deg, #f44336, #da190b);
    }

    .mini {
      font-size: 0.95rem;
      opacity: 0.85;
      margin-top: 8px;
    }

    @media(max-width: 768px) {
      .login-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

  <!-- LANDING PAGE -->
  <div id="landing" class="container">
    <div class="login-grid">

      <!-- ADMIN LOGIN -->
      <div class="glass">
        <h2><i class="fas fa-user-shield"></i> Sir / Leader Login</h2>

        <input id="adminUser" placeholder="Enter Username">
        <input type="password" id="adminPass" placeholder="Enter Password">

        <button class="btn" onclick="adminLogin()">
          <i class="fas fa-right-to-bracket"></i> Login
        </button>

        <button class="btn btn-danger" onclick="forgotPassword()">
          <i class="fas fa-key"></i> Forgot Password
        </button>

        <p class="mini">Default Demo: admin / admin123</p>
      </div>

      <!-- STUDENT LOGIN -->
      <div class="glass">
        <h2><i class="fas fa-user-graduate"></i> Student Login</h2>

        <input id="studentRoll" placeholder="Enter Roll Number">
        <button class="btn btn-sec" onclick="studentLogin()">
          <i class="fas fa-magnifying-glass"></i> Check Attendance
        </button>

        <p class="mini">Enter your roll number to check present/absent.</p>
      </div>

    </div>
  </div>


  <!-- ADMIN DASHBOARD -->
  <div id="adminDash" class="dash">

    <div class="header">
      <h1><i class="fas fa-chalkboard"></i> Admin Dashboard</h1>
      <a class="logout" onclick="logout()"><i class="fas fa-power-off"></i> Logout</a>
    </div>

    <div class="stats">
      <div class="glass stat">
        <div class="stat-num" style="color:#4caf50" id="totalStu">0</div>
        Total Students
      </div>

      <div class="glass stat">
        <div class="stat-num" style="color:#2196f3" id="presentStu">0</div>
        Present Today
      </div>

      <div class="glass stat">
        <div class="stat-num" style="color:#ff9800" id="rate">0%</div>
        Attendance Rate
      </div>

      <div class="glass stat">
        <div class="stat-num" style="color:#ffeb3b" id="absentStu">0</div>
        Absent Today
      </div>
    </div>

    <div class="glass">
      <h2>📊 Analytics & Section Report</h2>

      <div class="grid">
        <div class="chart-cont">
          <canvas id="sectionChart"></canvas>
        </div>

        <div class="chart-cont">
          <canvas id="attendanceChart"></canvas>
        </div>
      </div>
    </div>

  </div>


  <!-- STUDENT DASHBOARD -->
  <div id="studentDash" class="dash">

    <div class="header">
      <h1><i class="fas fa-user-graduate"></i> Student Attendance</h1>
      <a class="logout" onclick="logout()"><i class="fas fa-power-off"></i> Logout</a>
    </div>

    <div class="glass" style="text-align:center;padding:40px">
      <h2 id="stuName">Student Name</h2>
      <p class="mini" id="stuRoll"></p>
      <p class="mini" id="stuSection"></p>

      <div class="student-status">
        <span id="stuStatus" class="badge present">Present</span>
      </div>

      <div class="chart-cont">
        <canvas id="stuChart"></canvas>
      </div>
    </div>

  </div>


  <!-- TOAST -->
  <div id="toast" class="toast"></div>

    // ==============================
    // ADMIN CREDENTIALS
    // ==============================
    const ADMIN_CREDENTIALS = {
      username: "admin",
      password: "admin123"
    };

    let charts = {};

    // ==============================
    // TOAST FUNCTION
    // ==============================
    function showToast(msg, type="success") {
      const toast = document.getElementById("toast");
      toast.textContent = msg;
      toast.className = `toast ${type} show`;

      setTimeout(() => {
        toast.classList.remove("show");
      }, 3000);
    }

    // ==============================
    // STUDENT SEARCH FUNCTION
    // ==============================
    function findStudent(rollno) {
      rollno = rollno.toUpperCase().trim();

      for (let section in STUDENTS) {
        for (let student of STUDENTS[section]) {
          if (student[0] === rollno) {
            return {
              rollno: student[0],
              name: student[1],
              section: section
            };
          }
        }
      }
      return null;
    }

    // ==============================
    // ADMIN LOGIN
    // ==============================
    function adminLogin() {
      const user = document.getElementById("adminUser").value.trim();
      const pass = document.getElementById("adminPass").value.trim();

      if (user === ADMIN_CREDENTIALS.username && pass === ADMIN_CREDENTIALS.password) {
        showToast("Admin Login Successful!", "success");
        showDashboard("admin");
        initAdminDashboard();
      } else {
        showToast("Invalid Admin Username or Password!", "error");
      }
    }

    // ==============================
    // STUDENT LOGIN
    // ==============================
    function studentLogin() {
      const rollno = document.getElementById("studentRoll").value.trim();

      if (rollno === "") {
        showToast("Enter Roll Number!", "error");
        return;
      }

      const student = findStudent(rollno);

      if (student) {
        showToast("Student Found!", "success");
        showDashboard("student");
        showStudentStatus(student);
      } else {
        showToast("Student Not Found!", "error");
      }
    }

    // ==============================
    // DASHBOARD SWITCH
    // ==============================
    function showDashboard(type) {
      document.getElementById("landing").style.display = "none";
      document.getElementById("adminDash").style.display = "none";
      document.getElementById("studentDash").style.display = "none";

      if (type === "admin") document.getElementById("adminDash").style.display = "block";
      if (type === "student") document.getElementById("studentDash").style.display = "block";
    }

    // ==============================
    // LOGOUT
    // ==============================
    function logout() {
      document.getElementById("landing").style.display = "flex";
      document.getElementById("adminDash").style.display = "none";
      document.getElementById("studentDash").style.display = "none";

      document.getElementById("adminUser").value = "";
      document.getElementById("adminPass").value = "";
      document.getElementById("studentRoll").value = "";

      showToast("Logged Out Successfully!", "info");
    }

    // ==============================
    // ADMIN DASHBOARD INIT
    // ==============================
    function initAdminDashboard() {
      updateStats();
      initCharts();
    }

    function getTotalStudents() {
      return Object.values(STUDENTS).reduce((sum, arr) => sum + arr.length, 0);
    }

    function updateStats() {
      const total = getTotalStudents();
      const present = Math.floor(total * 0.85);
      const absent = total - present;
      const rate = ((present / total) * 100).toFixed(1);

      document.getElementById("totalStu").textContent = total;
      document.getElementById("presentStu").textContent = present;
      document.getElementById("absentStu").textContent = absent;
      document.getElementById("rate").textContent = rate + "%";
    }

    // ==============================
    // CHARTS INIT
    // ==============================
    function initCharts() {
      if (charts.section) charts.section.destroy();
      if (charts.attendance) charts.attendance.destroy();

      const sectionCtx = document.getElementById("sectionChart").getContext("2d");
      charts.section = new Chart(sectionCtx, {
        type: "pie",
        data: {
          labels: ["Section A", "Section B", "Section C", "Section D"],
          datasets: [{
            data: [
              STUDENTS.A.length,
              STUDENTS.B.length,
              STUDENTS.C.length,
              STUDENTS.D.length
            ]
          }]
        }
      });

      const total = getTotalStudents();
      const present = Math.floor(total * 0.85);
      const absent = total - present;

      const attendanceCtx = document.getElementById("attendanceChart").getContext("2d");
      charts.attendance = new Chart(attendanceCtx, {
        type: "bar",
        data: {
          labels: ["Present", "Absent"],
          datasets: [{
            label: "Students",
            data: [present, absent]
          }]
        }
      });
    }

    // ==============================
    // STUDENT STATUS DISPLAY
    // ==============================
    function showStudentStatus(student) {
      document.getElementById("stuName").textContent = student.name;
      document.getElementById("stuRoll").textContent = "Roll No: " + student.rollno;
      document.getElementById("stuSection").textContent = "Section: " + student.section;

      const status = Math.random() > 0.25 ? "Present" : "Absent";

      const statusEl = document.getElementById("stuStatus");
      statusEl.textContent = status;

      if (status === "Present") {
        statusEl.className = "badge present";
      } else {
        statusEl.className = "badge absent";
      }

      const presentDays = Math.floor(Math.random() * 10) + 20;
      const absentDays = Math.floor(Math.random() * 5) + 2;

      const ctx = document.getElementById("stuChart").getContext("2d");
      if (charts.student) charts.student.destroy();

      charts.student = new Chart(ctx, {
        type: "doughnut",
        data: {
          labels: ["Present Days", "Absent Days"],
          datasets: [{
            data: [presentDays, absentDays]
          }]
        }
      });
    }

    // ==============================
    // FORGOT PASSWORD (DEMO ONLY)
    // ==============================
    function forgotPassword() {
      showToast("Forgot Password will be handled by Flask Gmail backend!", "info");
      alert("Forgot Password Feature will work when connected to Flask backend.\n\nSir will enter email and password will be sent to Gmail.");
    }

    // ==============================
    // ENTER KEY SUPPORT
    // ==============================
    document.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        if (document.getElementById("landing").style.display !== "none") {
          if (document.activeElement.id === "adminPass") {
            adminLogin();
          } else if (document.activeElement.id === "studentRoll") {
            studentLogin();
          }
        }
      }
    });
  </script>
