<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:Arial,sans-serif;background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh}
        .glass{background:rgba(255,255,255,0.1);backdrop-filter:blur(20px);border-radius:20px;border:1px solid rgba(255,255,255,0.2);padding:30px;color:white}
        .container{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
        .login-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;max-width:1000px}
        h2{font-size:2rem;margin-bottom:20px}
        input{width:100%;padding:12px;margin:10px 0;border:none;border-radius:8px;background:rgba(255,255,255,0.2);color:white}
        input::placeholder{color:rgba(255,255,255,0.8)}
        .btn{width:100%;padding:12px;background:linear-gradient(45deg,#ff6b6b,#feca57);border:none;border-radius:8px;color:white;font-weight:600;cursor:pointer;margin:10px 0}
        .btn:hover{transform:translateY(-2px)}
        .btn-sec{background:linear-gradient(45deg,#4ecdc4,#44a08d)}
        .dash{display:none;padding:20px;max-width:1400px;margin:0 auto}
        .header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}
        .logout{background:linear-gradient(45deg,#ff4757,#ff3838);padding:10px 20px;border-radius:20px;color:white;text-decoration:none}
        .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px;margin-bottom:30px}
        .stat{padding:20px;text-align:center}
        .stat-num{font-size:2rem;font-weight:bold;margin-bottom:10px}
        .chart-cont{height:350px;margin:20px 0}
        .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:20px}
        .toast{position:fixed;top:20px;right:20px;padding:15px;border-radius:10px;color:white;transform:translateX(400px);transition:all 0.3s;z-index:1000}
        .toast.show{transform:translateX(0)}
        .success{background:#4caf50}.error{background:#f44336}
        @media(max-width:768px){.login-grid{grid-template-columns:1fr}}
    </style>
</head>
<body>
    <div id="landing" class="container">
        <div class="login-grid">
            <div class="glass">
                <h2><i class="fas fa-user-shield"></i> Admin Login</h2>
                <input id="adminUser" placeholder="Username">
                <input type="password" id="adminPass" placeholder="Password">
                <button class="btn" onclick="adminLogin()">Login</button>
            </div>
            <div class="glass">
                <h2><i class="fas fa-user-graduate"></i> Student Login</h2>
                <input id="studentRoll" placeholder="Roll Number">
                <button class="btn btn-sec" onclick="studentLogin()">Check Status</button>
            </div>
        </div>
    </div>

    <div id="adminDash" class="dash">
        <div class="header">
            <h1><i class="fas fa-chalkboard"></i> Dashboard</h1>
            <a class="logout" onclick="logout()">Logout</a>
        </div>
        <div class="stats">
            <div class="glass stat"><div class="stat-num" style="color:#4caf50" id="totalStu">0</div>Total Students</div>
            <div class="glass stat"><div class="stat-num" style="color:#2196f3" id="presentStu">0</div>Present Today</div>
            <div class="glass stat"><div class="stat-num" style="color:#ff9800" id="rate">0%</div>Attendance Rate</div>
        </div>
        <div class="glass">
            <h2>📊 Section Analytics</h2>
            <div class="grid">
                <div class="chart-cont"><canvas id="sectionChart"></canvas></div>
                <div class="chart-cont"><canvas id="attendanceChart"></canvas></div>
            </div>
        </div>
    </div>

        function showToast(msg, type='success') {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.className = `toast ${type} show`;
            setTimeout(() => toast.classList.remove('show'), 3000);
        }

        function adminLogin() {
            const user = document.getElementById('adminUser').value;
            const pass = document.getElementById('adminPass').value;
            
            if(user === ADMIN_CREDENTIALS.username && pass === ADMIN_CREDENTIALS.password) {
                currentUser = {role: 'admin'};
                showDashboard('admin');
                initAdminDashboard();
                return;
            }
            showToast('Invalid credentials', 'error');
        }

        function studentLogin() {
            const rollno = document.getElementById('studentRoll').value.toUpperCase();
            
            // Simulate student lookup (replace with actual student data lookup)
            const student = findStudent(rollno);
            if(student) {
                currentUser = student;
                showDashboard('student');
                showStudentStatus(student);
                return;
            }
            showToast('Student not found', 'error');
        }

        function findStudent(rollno) {
            // Simulate finding student - replace with actual data lookup
            const sections = Object.keys(STUDENTS);
            for(let section of sections) {
                if(Math.random() > 0.7) { // Random match for demo
                    return {rollno, name: `Student ${rollno}`, section};
                }
            }
            return null;
        }

        function showDashboard(type) {
            document.getElementById('landing').style.display = 'none';
            document.getElementById(type + 'Dash').style.display = 'block';
        }

        function logout() {
            currentUser = null;
            document.getElementById('landing').style.display = 'flex';
            document.getElementById('adminDash').style.display = 'none';
            document.getElementById('studentDash').style.display = 'none';
            document.getElementById('adminUser').value = '';
            document.getElementById('adminPass').value = '';
            document.getElementById('studentRoll').value = '';
        }

        function initAdminDashboard() {
            updateStats();
            initCharts();
        }

        function updateStats() {
            const total = Object.values(STUDENTS).reduce((a,b)=>a+b,0);
            const present = Math.floor(total * 0.85); // 85% demo attendance
            const rate = ((present/total)*100).toFixed(1);
            
            document.getElementById('totalStu').textContent = total;
            document.getElementById('presentStu').textContent = present;
            document.getElementById('rate').textContent = rate + '%';
        }

                    labels: ['Section A', 'Section B', 'Section C', 'Section D'],
                    datasets: [{
                        data: [STUDENTS.A, STUDENTS.B, STUDENTS.C, STUDENTS.D],
                        backgroundColor: ['#FF6384', '#36A2EB', '#FFCE56', '#4BC0C0']
                    }]
                }
            });

            // Attendance bar chart
            const attendanceCtx = document.getElementById('attendanceChart').getContext('2d');
            charts.attendance = new Chart(attendanceCtx, {
                type: 'bar',
                data: {
                    labels: ['Present', 'Absent'],
                    datasets: [{
                        data: [85, 15],
                        backgroundColor: ['#4caf50', '#f44336']
                    }]
                }
            });
        }

        function showStudentStatus(student) {
            document.getElementById('stuName').textContent = student.name;
            const status = Math.random() > 0.2 ? 'Present' : 'Absent';
            const statusEl = document.getElementById('stuStatus');
            statusEl.textContent = status;
            statusEl.style.background = status === 'Present' ? 
                'linear-gradient(45deg,#4caf50,#45a049)' : 
                'linear-gradient(45deg,#f44336,#da190b)';
            
            // Student chart
            const ctx = document.getElementById('stuChart').getContext('2d');
            new Chart(ctx, {
                type: 'doughnut',
                data: {
                    labels: ['Present', 'Absent'],
                    datasets: [{
                        data: [status === 'Present' ? 85 : 15, status === 'Present' ? 15 : 85],
                        backgroundColor: ['#4caf50', '#f44336']
                    }]
                }
            });
        }

        // Enter key support
        document.addEventListener('keypress', e => {
            if(e.key === 'Enter') {
                if(document.getElementById('landing').style.display !== 'none') {
                    if(document.activeElement.id === 'adminPass') adminLogin();
                }
            }
        });
    </script>
</body>
</html>
